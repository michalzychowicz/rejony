<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rejony – wydruk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eee;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
        }

        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;

            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;

            padding: 14px 20px;

            background: #222;
            color: white;
        }

        .toolbar button,
        .toolbar select {
            padding: 9px 14px;
            border: 0;
            border-radius: 6px;
            font-size: 14px;
        }

        .toolbar button {
            background: white;
            color: #222;
            font-weight: bold;
            cursor: pointer;
        }

        .toolbar label {
            font-size: 14px;
        }

        #status {
            margin-left: auto;
            color: #ccc;
            font-size: 13px;
        }

        #printArea {
            max-width: 210mm;
            margin: 25px auto;
        }

        .block {
            width: 100%;
            margin-bottom: 20px;

            background: white;

            border: 2px solid black;

            break-inside: avoid;
            page-break-inside: avoid;
        }

        .block-title {
            padding: 8px;

            border-bottom: 2px solid black;

            text-align: center;
            font-size: 21px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td,
        th {
            padding: 6px 8px;
            border-bottom: 1px solid black;
            vertical-align: top;
            text-align: left;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        td:first-child,
        th:first-child {
            border-right: 1px solid black;
        }

        .street-name {
            width: 42%;
            font-weight: bold;
        }

        .region-number {
            width: 22%;
            font-weight: bold;
            text-align: center;
        }

        .rule {
            width: 58%;
        }

        .letter {
            margin: 28px 0 10px;

            padding-bottom: 4px;

            border-bottom: 3px solid black;

            font-size: 26px;
            font-weight: bold;

            break-after: avoid;
            page-break-after: avoid;
        }

        .empty {
            padding: 30px;
            background: white;
            text-align: center;
        }

        @page {
            size: A4 portrait;
            margin: 12mm;
        }

        @media print {

            body {
                background: white;
            }

            .toolbar {
                display: none !important;
            }

            #printArea {
                width: 100%;
                max-width: none;
                margin: 0;
            }

            .block {
                margin-bottom: 7mm;
            }

            .block-title {
                font-size: 17px;
                padding: 5px;
            }

            td,
            th {
                font-size: 11px;
                padding: 3px 5px;
            }

            .letter {
                margin-top: 5mm;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="toolbar">

    <button onclick="window.print()">
        🖨️ Drukuj / PDF
    </button>

    <label for="viewMode">
        Układ:
    </label>

    <select id="viewMode">

        <option value="regions">
            Według rejonów
        </option>

        <option value="streets">
            Według ulic
        </option>

    </select>


    <label for="itemFilter">
        Pokaż:
    </label>

    <select id="itemFilter">
        <option value="all">
            Wszystkie
        </option>
    </select>


    <span id="status">
        Wczytywanie...
    </span>

</div>


<main id="printArea"></main>


<script>

let data;

const viewMode =
    document.getElementById("viewMode");

const itemFilter =
    document.getElementById("itemFilter");

const printArea =
    document.getElementById("printArea");

const status =
    document.getElementById("status");


/* ===============================
   WCZYTANIE DANYCH
=============================== */

fetch("./data/rejony.json")

    .then(response => {

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        return response.json();
    })

    .then(json => {

        data = json;

        refreshFilter();
        render();

        status.textContent =
            `Załadowano ${data.streets.length} ulic`;
    })

    .catch(error => {

        console.error(error);

        status.textContent =
            "Błąd wczytywania";

        printArea.innerHTML = `
            <div class="empty">
                Nie udało się wczytać
                <strong>data/rejony.json</strong>.
            </div>
        `;
    });


/* ===============================
   ZDARZENIA
=============================== */

viewMode.addEventListener(
    "change",
    () => {

        refreshFilter();
        render();
    }
);


itemFilter.addEventListener(
    "change",
    render
);


/* ===============================
   REJONY
=============================== */

function getRegions() {

    const regions =
        new Set();


    for (const street of data.streets) {

        for (
            const assignment
            of street.assignments
        ) {

            regions.add(
                assignment.region
            );
        }
    }


    return [...regions]
        .sort(
            (a, b) => a - b
        );
}


/* ===============================
   FILTR
=============================== */

function refreshFilter() {

    itemFilter.innerHTML = `
        <option value="all">
            Wszystkie
        </option>
    `;


    if (
        viewMode.value ===
        "regions"
    ) {

        for (
            const region
            of getRegions()
        ) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                region;

            option.textContent =
                `Rejon ${region}`;

            itemFilter.appendChild(
                option
            );
        }

    } else {

        const streets =
            [...data.streets]
                .sort(
                    (a, b) =>
                        a.street.localeCompare(
                            b.street,
                            "pl"
                        )
                );


        for (
            const street
            of streets
        ) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                street.street;

            option.textContent =
                street.street;

            itemFilter.appendChild(
                option
            );
        }
    }
}


/* ===============================
   FORMAT REGUŁ
=============================== */

function formatRule(rule) {

    if (
        rule.type === "all"
    ) {

        if (
            rule.exclude?.length
        ) {

            return (
                "bez: " +
                formatExclusions(
                    rule.exclude
                )
            );
        }

        return "";
    }


    if (
        rule.type === "allExcept"
    ) {

        return (
            "bez: " +
            formatExclusions(
                rule.exclude ?? []
            )
        );
    }


    if (
        rule.type === "list"
    ) {

        let text =
            (
                rule.values ??
                []
            ).join(", ");


        if (
            rule.exclude?.length
        ) {

            text +=
                "; bez: " +
                formatExclusions(
                    rule.exclude
                );
        }

        return text;
    }


    if (
        rule.type === "range"
    ) {

        let prefix = "";


        if (
            rule.parity ===
            "even"
        ) {

            prefix =
                "parzyste: ";
        }


        if (
            rule.parity ===
            "odd"
        ) {

            prefix =
                "nieparzyste: ";
        }


        let range;


        if (
            rule.to === null ||
            rule.to === undefined
        ) {

            range =
                `od ${rule.from} do końca`;

        } else if (
            rule.from === rule.to
        ) {

            range =
                String(rule.from);

        } else {

            range =
                `${rule.from}-${rule.to}`;
        }


        let text =
            prefix + range;


        if (
            rule.exclude?.length
        ) {

            text +=
                "; bez: " +
                formatExclusions(
                    rule.exclude
                );
        }


        return text;
    }


    return "⚠ nieznana reguła";
}


/* ===============================
   WYJĄTKI
=============================== */

function formatExclusions(
    exclusions
) {

    return exclusions

        .map(exclusion => {

            if (
                typeof exclusion ===
                "string"
            ) {

                return exclusion;
            }


            if (
                !exclusion ||
                typeof exclusion !==
                "object"
            ) {

                return "?";
            }


            let text;


            if (
                exclusion.to === null ||
                exclusion.to === undefined
            ) {

                text =
                    `od ${exclusion.from} do końca`;

            } else if (
                exclusion.from ===
                exclusion.to
            ) {

                text =
                    String(
                        exclusion.from
                    );

            } else {

                text =
                    `${exclusion.from}-${exclusion.to}`;
            }


            if (
                exclusion.parity ===
                "even"
            ) {

                text +=
                    " parzyste";
            }


            if (
                exclusion.parity ===
                "odd"
            ) {

                text +=
                    " nieparzyste";
            }


            return text;
        })

        .join(", ");
}


/* ===============================
   ŁĄCZENIE REGUŁ
=============================== */

function formatRules(rules) {

    const formatted =
        rules
            .map(formatRule)
            .filter(Boolean);


    if (
        formatted.length === 0
    ) {

        return "";
    }


    return formatted
        .map(escapeHtml)
        .join("<br>");
}


/* ===============================
   WIDOK WG REJONÓW
=============================== */

function renderByRegions() {

    let regions;


    if (
        itemFilter.value ===
        "all"
    ) {

        regions =
            getRegions();

    } else {

        regions = [
            Number(
                itemFilter.value
            )
        ];
    }


    let html = "";


    for (
        const region
        of regions
    ) {

        const streets = [];


        for (
            const street
            of data.streets
        ) {

            for (
                const assignment
                of street.assignments
            ) {

                if (
                    assignment.region ===
                    region
                ) {

                    streets.push({

                        street:
                            street.street,

                        rules:
                            assignment.rules
                    });
                }
            }
        }


        streets.sort(
            (a, b) =>
                a.street.localeCompare(
                    b.street,
                    "pl"
                )
        );


        let rows = "";


        for (
            const item
            of streets
        ) {

            rows += `

                <tr>

                    <td class="street-name">
                        ${escapeHtml(
                            item.street
                        )}
                    </td>

                    <td class="rule">
                        ${formatRules(
                            item.rules
                        )}
                    </td>

                </tr>

            `;
        }


        html += `

            <section class="block">

                <div class="block-title">
                    Rejon ${region}
                </div>

                <table>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>

            </section>

        `;
    }


    printArea.innerHTML =
        html;
}


/* ===============================
   WIDOK WG ULIC
=============================== */

function renderByStreets() {

    let streets;


    if (
        itemFilter.value ===
        "all"
    ) {

        streets =
            [...data.streets];

    } else {

        streets =
            data.streets.filter(
                street =>
                    street.street ===
                    itemFilter.value
            );
    }


    streets.sort(
        (a, b) =>
            a.street.localeCompare(
                b.street,
                "pl"
            )
    );


    let html = "";

    let previousLetter =
        null;


    for (
        const street
        of streets
    ) {

        /*
            Litera alfabetu pokazuje się
            tylko przy wydruku wszystkich ulic.
        */

        if (
            itemFilter.value ===
            "all"
        ) {

            const letter =
                getFirstLetter(
                    street.street
                );


            if (
                letter !==
                previousLetter
            ) {

                html += `
                    <div class="letter">
                        ${escapeHtml(
                            letter
                        )}
                    </div>
                `;

                previousLetter =
                    letter;
            }
        }


        const assignments =
            [...street.assignments]
                .sort(
                    (a, b) =>
                        a.region -
                        b.region
                );


        let rows = "";


        for (
            const assignment
            of assignments
        ) {

            rows += `

                <tr>

                    <td class="region-number">
                        Rejon
                        ${assignment.region}
                    </td>

                    <td class="rule">
                        ${formatRules(
                            assignment.rules
                        )}
                    </td>

                </tr>

            `;
        }


        html += `

            <section class="block">

                <div class="block-title">
                    ${escapeHtml(
                        street.street
                    )}
                </div>

                <table>

                    <thead>
                        <tr>
                            <th class="region-number">
                                Rejon
                            </th>

                            <th>
                                Numery budynków
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        ${rows}
                    </tbody>

                </table>

            </section>

        `;
    }


    printArea.innerHTML =
        html;
}


/* ===============================
   PIERWSZA LITERA
=============================== */

function getFirstLetter(
    street
) {

    const first =
        street
            .trim()
            .charAt(0)
            .toUpperCase();


    /*
        Nazwy rozpoczynające się cyfrą
        trafiają do sekcji "#".
    */

    if (
        /[0-9]/.test(first)
    ) {

        return "#";
    }


    return first;
}


/* ===============================
   GŁÓWNE RENDEROWANIE
=============================== */

function render() {

    if (!data) {
        return;
    }


    if (
        viewMode.value ===
        "regions"
    ) {

        renderByRegions();

    } else {

        renderByStreets();
    }
}


/* ===============================
   ESCAPE HTML
=============================== */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        );
}

</script>

</body>
</html>
